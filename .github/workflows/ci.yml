name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.18'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy packages simulator evaluator apps lab_mcp
      - run: uv run pytest -q
      - run: npm ci --prefix apps/frontend
      - run: npm run lint --prefix apps/frontend && npm run build --prefix apps/frontend
      - run: cd apps/frontend && npx playwright install --with-deps chromium && npm run test:e2e
      - run: docker compose build && docker compose up -d
      - run: uv run python scripts/smoke.py
      - if: always()
        run: docker compose logs > compose.log && docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-artifacts
          path: |
            artifacts/
            apps/frontend/test-results/
            compose.log
